name: Test macOS GUI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Start interactive SSH session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
