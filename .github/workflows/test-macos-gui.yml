name: Test macOS GUI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Start PostgreSQL
        run: |
          set -e
          brew install postgresql@16
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          export PATH="$PG_BIN:$PATH"

          brew services start postgresql@16

          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432; then
              break
            fi
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 5432

          createuser -h 127.0.0.1 -U "$USER" --superuser admin || true
          createdb -h 127.0.0.1 -U "$USER" --owner=admin theknife || true
          psql -h 127.0.0.1 -U "$USER" -d postgres -c "ALTER USER admin WITH PASSWORD 'admin';"

      - name: Download JavaFX SDK for macOS
        id: javafx
        run: |
          set -e
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            JFX_ARCH="osx-aarch64"
          else
            JFX_ARCH="osx-x64"
          fi
          curl -fsSL "https://download2.gluonhq.com/openjfx/21.0.4/openjfx-21.0.4_${JFX_ARCH}_bin-sdk.zip" -o /tmp/javafx.zip
          unzip -q /tmp/javafx.zip -d /tmp/javafx-sdk
          JFX_LIB="$(find /tmp/javafx-sdk -maxdepth 3 -type d -name "lib" | head -n 1)"
          echo "jfx_lib=$JFX_LIB" >> "$GITHUB_OUTPUT"

      - name: Start interactive SSH session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true

      - name: Upload verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui-verification
          path: |
            client-screenshot.png
            server.log
            client.log
          if-no-files-found: warn
